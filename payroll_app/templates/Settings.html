{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
  <h1 class="mb-4">Company Settings</h1>
  <div class="card shadow-sm border-0 p-4" style="max-width:700px;">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3">
        {% for field in form %}
        <div class="col-md-6">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors|striptags }}</div>{% endif %}
        </div>
        {% endfor %}
      </div>
      <button type="submit" class="btn btn-primary mt-3">Save Settings</button>
    </form>
  </div>
{% endblock %}
