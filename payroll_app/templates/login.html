<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign In - Edge Pro Axis Payroll</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; background:#0f172a; height:100vh; display:flex; align-items:center; justify-content:center; }
  .login-card { background:#fff; border-radius:12px; padding:2.5rem; width:100%; max-width:380px; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
  .login-card h1 { font-size:1.4rem; font-weight:700; margin-bottom:0.2rem; }
  .login-card p.sub { color:#64748b; font-size:13px; margin-bottom:1.5rem; }
</style>
</head>
<body>
<div id="animatedBg" style="position:fixed;inset:0;z-index:-1;pointer-events:none;transition:background 0.4s cubic-bezier(0.1,0.4,0.2,1);"></div>
<script>
(function(){
  const bg = document.getElementById("animatedBg");
  function setBg(mx, my, a, h){
    bg.style.background =
      "linear-gradient(" + a + "deg, hsla(" + h + ",35%,85%,0.5) 0%, hsla(" + (h+40) + ",30%,80%,0.35) 50%, hsla(" + (h+80) + ",35%,85%,0.5) 100%)," +
      "radial-gradient(circle at " + mx + "% " + my + "%, hsl(" + (h-20) + ",40%,92%) 0%, hsl(" + h + ",30%,80%) 50%, hsl(" + (h+40) + ",25%,72%) 100%)";
  }
  setBg(50, 50, 45, 200);
  window.addEventListener("mousemove", function(e){
    const xPercent = Math.round((e.clientX / window.innerWidth) * 100);
    const yPercent = Math.round((e.clientY / window.innerHeight) * 100);
    const a = Math.round((e.clientX / window.innerWidth) * 180 + (e.clientY / window.innerHeight) * 180);
    const h = Math.round((e.clientX / window.innerWidth) * 100 + 180);
    setBg(xPercent, yPercent, a, h);
  });
})();
</script>

  <div class="login-card">
    <h1>Edge Pro Axis</h1>
    <p class="sub">Payroll &amp; HR Management - Sign in to continue</p>
    {% if error %}
    <div class="alert alert-danger py-2 small">{{ error }}</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label small">Username</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label small">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Sign In</button>
    </form>
    <p class="text-center small mt-3 mb-0"><a href="{% url 'register' %}">New employee? Create an account</a></p>
  </div>
</body>
</html>
