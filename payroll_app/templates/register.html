<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - Edge Pro Axis Payroll</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; background:#0f172a; height:100vh; display:flex; align-items:center; justify-content:center; }
  .login-card { background:#fff; border-radius:12px; padding:2.5rem; width:100%; max-width:400px; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
  .login-card h1 { font-size:1.4rem; font-weight:700; margin-bottom:0.2rem; }
  .login-card p.sub { color:#64748b; font-size:13px; margin-bottom:1.5rem; }
</style>
</head>
<body>
  <div class="login-card">
    <h1>Create Account</h1>
    <p class="sub">Edge Pro Axis Payroll - Register using your Employee Code</p>
    {% if error %}
    <div class="alert alert-danger py-2 small">{{ error }}</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label small">Employee Code</label>
        <input type="text" name="employee_code" class="form-control" placeholder="e.g. EPRO0057" required>
      </div>
      <div class="mb-3">
        <label class="form-label small">Choose Username</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label small">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label small">Confirm Password</label>
        <input type="password" name="password2" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Create Account</button>
    </form>
    <p class="text-center small mt-3 mb-0"><a href="{% url 'login' %}">Already have an account? Sign in</a></p>
  </div>
</body>
</html>
