<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - Edge Pro Axis Payroll</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; height:100vh; display:flex; align-items:center; justify-content:center; }
  .login-card { position:relative; z-index:10; background:#fff; border-radius:12px; padding:2.5rem; width:100%; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
  .login-card h1 { font-size:1.4rem; font-weight:700; margin-bottom:0.2rem; }
  .login-card p.sub { color:#64748b; font-size:13px; margin-bottom:1.5rem; }
  .verified-badge { display:none; background:#e5f8f1; color:#0f9d6a; padding:8px 12px; border-radius:8px; font-size:13px; font-weight:600; margin-bottom:1rem; }
  .otp-section { display:none; }
  .locked-field { background:#f1f3f5; }
  #accountFields { opacity:0.4; pointer-events:none; }
  #accountFields.enabled { opacity:1; pointer-events:auto; }
  .msg { font-size:12.5px; margin-top:6px; min-height:16px; }
  .msg.err { color:#dc3545; }
  .msg.ok { color:#0f9d6a; }
</style>
</head>
<body>
<div id="animatedBg" style="position:fixed;inset:0;z-index:-1;pointer-events:none;transition:background 0.4s cubic-bezier(0.1,0.4,0.2,1);"></div>
<script>
(function(){
  const bg = document.getElementById("animatedBg");
  function setBg(mx, my, a, h){
    bg.style.background =
      "linear-gradient(" + a + "deg, hsla(" + h + ",35%,85%,0.5) 0%, hsla(" + (h+40) + ",30%,80%,0.35) 50%, hsla(" + (h+80) + ",35%,85%,0.5) 100%)," +
      "radial-gradient(circle at " + mx + "% " + my + "%, hsl(" + (h-20) + ",40%,92%) 0%, hsl(" + h + ",30%,80%) 50%, hsl(" + (h+40) + ",25%,72%) 100%)";
  }
  setBg(50, 50, 45, 200);
  window.addEventListener("mousemove", function(e){
    const xPercent = Math.round((e.clientX / window.innerWidth) * 100);
    const yPercent = Math.round((e.clientY / window.innerHeight) * 100);
    const a = Math.round((e.clientX / window.innerWidth) * 180 + (e.clientY / window.innerHeight) * 180);
    const h = Math.round((e.clientX / window.innerWidth) * 100 + 180);
    setBg(xPercent, yPercent, a, h);
  });
})();
</script>

  <div class="login-card">
    <h1>Create Account</h1>
    <p class="sub">Edge Pro Axis Payroll - Create your account</p>
    {% if error %}
    <div class="alert alert-danger py-2 small">{{ error }}</div>
    {% endif %}

    <div id="verifiedBadge" class="verified-badge">&#10003; Email Verified Successfully</div>

    <form method="post" id="registerForm">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label small">Email Address</label>
        <div class="input-group">
          <input type="email" id="emailInput" name="email" class="form-control" required autofocus>
          <button type="button" id="sendCodeBtn" class="btn btn-outline-primary">Send OTP</button>
        </div>
        <div id="emailMsg" class="msg"></div>
      </div>

      <div class="mb-3 otp-section" id="otpSection">
        <label class="form-label small">Enter Verification OTP</label>
        <div class="input-group">
          <input type="text" id="otpInput" maxlength="6" class="form-control" placeholder="6-digit code">
          <button type="button" id="verifyBtn" class="btn btn-outline-success">Verify OTP</button>
        </div>
        <div id="otpMsg" class="msg"></div>
        <button type="button" id="resendBtn" class="btn btn-link btn-sm p-0 mt-1">Resend Code</button>
      </div>

      <div class="mb-3">
        <label class="form-label small">Full Name</label>
        <input type="text" name="full_name" class="form-control" required autocomplete="off">
      </div>
      <div class="mb-3">
        <label class="form-label small">Mobile Number</label>
        <input type="tel" name="mobile_number" class="form-control" pattern="[0-9]{10}" maxlength="10" placeholder="10-digit mobile number" required>
      </div>

      <div id="accountFields">
        <div class="mb-3">
          <label class="form-label small">Choose Username</label>
          <input type="text" name="username" class="form-control" required autocomplete="new-password">
        </div>
        <div class="mb-3">
          <label class="form-label small">Password</label>
          <input type="password" name="password" class="form-control" required autocomplete="new-password">
        </div>
        <div class="mb-3">
          <label class="form-label small">Confirm Password</label>
          <input type="password" name="password2" class="form-control" required autocomplete="new-password">
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary w-100" disabled>Create Account</button>
      </div>
    </form>
    <p class="text-center small mt-3 mb-0"><a href="{% url 'login' %}">Already have an account? Sign in</a></p>
  </div>

<script>
(function(){
  function getCookie(name) {
    const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return v ? v.pop() : '';
  }
  const csrftoken = getCookie('csrftoken');
  alert('CSRF token value: [' + csrftoken + '] Length: ' + csrftoken.length);
  alert('CSRF token value: [' + csrftoken + '] Length: ' + csrftoken.length);
  const emailInput = document.getElementById('emailInput');
  const sendCodeBtn = document.getElementById('sendCodeBtn');
  const emailMsg = document.getElementById('emailMsg');
  const otpSection = document.getElementById('otpSection');
  const otpInput = document.getElementById('otpInput');
  const verifyBtn = document.getElementById('verifyBtn');
  const otpMsg = document.getElementById('otpMsg');
  const resendBtn = document.getElementById('resendBtn');
  const verifiedBadge = document.getElementById('verifiedBadge');
  const accountFields = document.getElementById('accountFields');
  const submitBtn = document.getElementById('submitBtn');
  let verifiedEmail = null;
  let cooldown = false;

  function sendCode(){
    const email = emailInput.value.trim();
    if (!email) { emailMsg.textContent = 'Please enter your email address.'; emailMsg.className = 'msg err'; return; }
    if (cooldown) return;
    sendCodeBtn.disabled = true;
    sendCodeBtn.textContent = 'Sending...';
    fetch('{% url "send_verification_code" %}', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrftoken},
      body: JSON.stringify({email: email})
    })
    .then(r => r.json())
    .then(data => {
      sendCodeBtn.disabled = false;
      sendCodeBtn.textContent = 'Send OTP';
      if (data.success) {
        emailMsg.textContent = data.message;
        emailMsg.className = 'msg ok';
        otpSection.style.display = 'block';
        emailInput.readOnly = true;
        emailInput.classList.add('locked-field');
        cooldown = true;
        setTimeout(() => { cooldown = false; }, 60000);
      } else {
        emailMsg.textContent = data.message;
        emailMsg.className = 'msg err';
      }
    })
    .catch(() => {
      sendCodeBtn.disabled = false;
      sendCodeBtn.textContent = 'Send OTP';
      emailMsg.textContent = 'Something went wrong. Please try again.';
      emailMsg.className = 'msg err';
    });
  }

  function verifyCode(){
    const email = emailInput.value.trim();
    const code = otpInput.value.trim();
    if (!code) { otpMsg.textContent = 'Please enter the verification code.'; otpMsg.className = 'msg err'; return; }
    verifyBtn.disabled = true;
    verifyBtn.textContent = 'Verifying...';
    fetch('{% url "verify_code" %}', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrftoken},
      body: JSON.stringify({email: email, code: code})
    })
    .then(r => r.json())
    .then(data => {
      verifyBtn.disabled = false;
      verifyBtn.textContent = 'Verify OTP';
      if (data.success) {
        otpMsg.textContent = '';
        verifiedBadge.style.display = 'block';
        otpSection.style.display = 'none';
        accountFields.classList.add('enabled');
        submitBtn.disabled = false;
        verifiedEmail = email;
      } else {
        otpMsg.textContent = data.message;
        otpMsg.className = 'msg err';
      }
    })
    .catch(() => {
      verifyBtn.disabled = false;
      verifyBtn.textContent = 'Verify OTP';
      otpMsg.textContent = 'Something went wrong. Please try again.';
      otpMsg.className = 'msg err';
    });
  }

  sendCodeBtn.addEventListener('click', sendCode);
  verifyBtn.addEventListener('click', verifyCode);
  resendBtn.addEventListener('click', function(e){ e.preventDefault(); sendCode(); });

  document.getElementById('registerForm').addEventListener('submit', function(e){
    if (!verifiedEmail) {
      e.preventDefault();
      emailMsg.textContent = 'Please verify your email before creating an account.';
      emailMsg.className = 'msg err';
    }
  });
})();
</script>
</body>
</html>
