{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - EdgePro Axis Payroll</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0B1120; --card:#151F32; --input-bg:#0F172A; --border:#263247; --accent:#2563EB; --accent-dark:#1D4ED8; --text:#F8FAFC; --text2:#94A3B8; --error:#EF4444; --error-soft:rgba(239,68,68,.12); }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{ font-family:'Inter',Arial,sans-serif; background:var(--bg); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; position:relative; overflow:hidden; }
  body::before{ content:''; position:absolute; top:-160px; left:50%; transform:translateX(-50%); width:640px; height:400px; background:radial-gradient(circle,rgba(37,99,235,.22) 0%,rgba(37,99,235,0) 70%); pointer-events:none; }
  .wrap{ position:relative; z-index:1; width:100%; max-width:420px; }
  .brand-row{ display:flex; justify-content:center; margin-bottom:28px; }
  .brand-row img{ height:34px; background:#fff; border-radius:10px; padding:8px 10px; object-fit:contain; }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:18px; padding:36px 34px; box-shadow:0 24px 70px rgba(0,0,0,.45); }
  .card h1{ font-size:20px; font-weight:800; color:var(--text); margin-bottom:6px; }
  .card p.sub{ color:var(--text2); font-size:13px; margin-bottom:24px; }
  .alert{ background:var(--error-soft); color:var(--error); padding:11px 14px; border-radius:9px; font-size:13px; margin-bottom:18px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--text2); margin-bottom:6px; }
  .field input{ width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:10px; background:var(--input-bg); color:var(--text); font-family:inherit; font-size:14px; transition:.15s; }
  .field input::placeholder{ color:#5b6b85; }
  .field input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,.15); }
  .btn{ width:100%; background:var(--accent); color:#fff; border:none; padding:13px; border-radius:10px; font-weight:700; font-size:14.5px; cursor:pointer; transition:.15s; }
  .btn:hover{ background:var(--accent-dark); box-shadow:0 8px 24px rgba(37,99,235,.35); }
  .footer-link{ text-align:center; font-size:13px; color:var(--text2); margin-top:22px; }
  .footer-link a{ color:var(--accent); text-decoration:none; font-weight:600; }
  .footer-link a:hover{ text-decoration:underline; }
  @media(max-width:480px){ .card{ padding:28px 22px; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand-row"><img src="{% static 'images/edgepro-logo.png' %}" alt="EdgePro Axis"></div>
    <div class="card">
      <h1>Create Account</h1>
      <p class="sub">EdgePro Axis Payroll &mdash; register to get started.</p>
      {% if error %}<div class="alert">{{ error }}</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="field"><label>Username</label><input type="text" name="username" placeholder="Choose a username" required autofocus></div>
        <div class="field"><label>Email</label><input type="email" name="email" placeholder="Enter your email" required></div>
        <div class="field"><label>Password</label><input type="password" name="password" placeholder="At least 8 characters" required></div>
        <div class="field"><label>Confirm Password</label><input type="password" name="password2" placeholder="Re-enter your password" required></div>
        <button type="submit" class="btn">Create Account</button>
      </form>
      <p class="footer-link">Already have an account? <a href="{% url 'login' %}">Sign in</a></p>
    </div>
  </div>
</body>
</html>
