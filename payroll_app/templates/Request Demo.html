{% extends "base.html" %}
{% block title %}Request a Demo · Payroll{% endblock %}
{% block content %}

<div class="page-header">
  <div>
    <h1 class="page-title">Request a Demo</h1>
    <p class="page-subtitle">Tell us about your company and we'll get in touch to schedule a demo.</p>
  </div>
</div>

<div class="card" style="max-width:600px;">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-grid">
        {% for field in form %}
        <div class="field">
          <label>{{ field.label }}</label>
          {{ field }}
          {{ field.errors }}
        </div>
        {% endfor %}
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Submit Request</button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
